name: release

# Publishing happens on a version tag and nowhere else:
#
#   node -p "require('./package.json').version"      # what will be published
#   git tag v0.2.2 && git push origin v0.2.2
#
# The tag is the confirmation, so nothing reaches npm by accident. The dist-tag follows
# the version: a prerelease (`0.2.1-rc.1`) publishes under `next` and leaves `latest` on
# the newest stable, while a plain version publishes as `latest`. Install a prerelease
# explicitly:
#
#   dsh plugin --profile web add @lolkda/dsh-cache-temperature@next
#
# Authentication is the NPM_TOKEN repository secret. Two facts about it, both learned on
# the first release attempt (run 36012163358, which got as far as `npm error code EOTP`):
#
# 1. This account has 2FA enabled, so a granular token whose bypass-2FA flag is off cannot
#    publish directly — npm demands a one-time password, which a runner cannot supply. The
#    secret therefore has to hold a granular token with bypass-2FA enabled (`bypass_2fa:
#    true`; check it with `curl -H "Authorization: Bearer $TOKEN"
#    https://registry.npmjs.org/-/npm/v1/tokens`). npm is targeting January 2027 to remove
#    direct publishing from bypass-2FA tokens, so this is a bootstrap mechanism, not the
#    destination: https://github.blog/changelog/2026-07-31-restricting-npm-bypass-2fa-granular-access-tokens/
#
# 2. The destination is trusted publishing (OIDC), which needs no secret and cannot leak
#    one. It cannot be configured up front — npm only offers the setting on a package that
#    already exists, so the first publish has to happen by token first. Afterwards, set it
#    up once on the package page:
#
#   npmjs.com -> @lolkda/dsh-cache-temperature -> Settings -> Trusted Publisher
#     Organization or user: lolkda
#     Repository:           dsh-cache-temperature
#     Workflow filename:    release.yml
#     Environment:          (leave empty)
#     Allowed actions:      npm publish
#
#   then delete the NPM_TOKEN secret and the NODE_AUTH_TOKEN line below. `id-token: write`
#   is already in place: npm exchanges this run's OIDC token for a short-lived credential.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (the tag path publishes without asking)
        type: boolean
        default: false

permissions:
  contents: write   # open the GitHub release
  id-token: write   # provenance, and trusted publishing once it is configured

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 12.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

      - name: committed lib/ must be a build of these sources
        run: pnpm check:build

      - name: the tarball must carry the bundle patch, the browser half, and the built host
        run: pnpm check:pack

      # A tag that disagrees with the manifest would publish something other than what it
      # claims, and npm has no way to take a version back.
      - name: the tag must name the version in package.json
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag ${GITHUB_REF_NAME} / package.json ${version}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json ${version}"
            exit 1
          fi

      - name: publish to npm
        if: github.event_name == 'push' || inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          # A prerelease must not take `latest` away from the newest stable: this plugin's
          # compatibility is pinned per DSH release, so an rc build installed by an older
          # deployment is a plugin the version gate refuses.
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          echo "publishing ${version} under dist-tag ${tag}"
          npm publish --provenance --access public --tag "$tag"

      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
