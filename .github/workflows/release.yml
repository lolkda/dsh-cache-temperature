name: release

# Publishing happens on a version tag and nowhere else:
#
#   node -p "require('./package.json').version"      # what will be published
#   git tag v0.2.2 && git push origin v0.2.2
#
# The tag is the confirmation, so nothing reaches npm by accident. The dist-tag follows
# the version: a prerelease (`0.2.1-rc.1`) publishes under `next` and leaves `latest` on
# the newest stable, while a plain version publishes as `latest`. Install a prerelease
# explicitly:
#
#   dsh plugin --profile web add @lolkda/dsh-cache-temperature@next
#
# Authentication is npm trusted publishing (OIDC): there is no NPM_TOKEN secret here, and
# none is wanted. The runner's OIDC token is exchanged for a short-lived publish
# credential, so there is no long-lived write token to leak or rotate, and npm attaches
# provenance. `id-token: write` below is what makes that exchange possible.
#
# Trusted publishing only exists for a package that is already on the registry, so it can
# never cover the very first publish. The one-time bootstrap is done by a maintainer with
# 2FA, either locally:
#
#   npm login                          # browser or OTP
#   npm publish --access public --tag next
#
# or from this repo once the package exists. Configure the trusted publisher afterwards:
#
#   npmjs.com -> @lolkda/dsh-cache-temperature -> Settings -> Trusted Publisher
#     Organization or user: lolkda
#     Repository:           dsh-cache-temperature
#     Workflow filename:    release.yml
#     Environment:          (leave empty)
#     Allowed actions:      npm publish
#
# Until that configuration exists, the publish step below fails — an earlier attempt using
# a token instead failed here with `npm error code EOTP`, because this account has 2FA and
# the token did not bypass it (run 36012163358).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (the tag path publishes without asking)
        type: boolean
        default: false

permissions:
  contents: write   # open the GitHub release
  id-token: write   # exchange for the publish credential, and sign provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 12.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

      - name: committed lib/ must be a build of these sources
        run: pnpm check:build

      - name: the tarball must carry the bundle patch, the browser half, and the built host
        run: pnpm check:pack

      # A tag that disagrees with the manifest would publish something other than what it
      # claims, and npm has no way to take a version back.
      - name: the tag must name the version in package.json
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag ${GITHUB_REF_NAME} / package.json ${version}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json ${version}"
            exit 1
          fi

      # No token and no registry-url: the registry and public access come from
      # publishConfig in package.json, and npm detects the OIDC environment on its own.
      - name: publish to npm
        if: github.event_name == 'push' || inputs.publish
        run: |
          version="$(node -p "require('./package.json').version")"
          # A prerelease must not take `latest` away from the newest stable: this plugin's
          # compatibility is pinned per DSH release, so an rc build installed by an older
          # deployment is a plugin the version gate refuses.
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          echo "publishing ${version} under dist-tag ${tag}"
          npm publish --provenance --access public --tag "$tag"

      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
